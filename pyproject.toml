[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contamscan"
version = "0.1.0"
description = "Measure benchmark contamination of an evaluation set in a training corpus"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["contamination", "benchmark", "n-gram", "evaluation", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pyarrow>=14"]

[project.scripts]
contamscan = "contamscan.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/contamscan"

[tool.hatch.build.targets.wheel]
packages = ["src/contamscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["contamscan"]
